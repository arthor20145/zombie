button{font-size:22px;padding:10px 30px;margin-top:16px;background:#7c4;border:0;color:#111;cursor:pointer;font-weight:bold}

(()=>{const c=document.createElement('canvas');c.width=2;c.height=256;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);

function ctex(f,rep){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');f(g);
 for(let i=0;i<900;i++){g.fillStyle=rnd()<.5?'rgba(0,0,0,.08)':'rgba(255,255,255,.06)';g.fillRect(rnd()*256,rnd()*256,2+rnd()*5,2+rnd()*5)}
 const t=new R.CanvasTexture(c);t.anisotropy=8;t.encoding=R.sRGBEncoding;t.wrapS=t.wrapT=R.RepeatWrapping;t.repeat.set(rep,rep);return t}

const mGround=mat(ctex(g=>{g.fillStyle='#4a4a44';g.fillRect(0,0,256,256);g.fillStyle='#d8c060';g.fillRect(124,0,8,90)},30));

const mCrate=mat(ctex(g=>{g.fillStyle='#6b4f2a';g.fillRect(0,0,256,256);g.strokeStyle='#3b2a14';g.lineWidth=8;g.strokeRect(4,4,248,248);g.beginPath();g.moveTo(0,0);g.lineTo(256,256);g.moveTo(256,0);g.lineTo(0,256);g.stroke()},1));
const mConc=mat(ctex(g=>{g.fillStyle='#8b8b85';g.fillRect(0,0,256,256)},2));
const mBuild=mat(ctex(g=>{g.fillStyle='#6b665c';g.fillRect(0,0,256,256);for(let y=16;y<256;y+=64)for(let x=16;x<256;x+=64){g.fillStyle=rnd()<.3?'#e8c060':'#1a232c';g.fillRect(x,y,32,40)}},2));
/* ================= MAP ================= */
const B=60,boxes=[],bm=[];
const ground=new R.Mesh(new R.PlaneGeometry(2*B,2*B),mGround);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function addBox(x,z,w,h,d,m){const me=new R.Mesh(new R.BoxGeometry(w,h,d),m);me.position.set(x,h/2,z);me.castShadow=me.receiveShadow=true;scene.add(me);
 boxes.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,top:h,cx:x,cz:z,r:Math.hypot(w,d)/2});bm.push(me)}
addBox(0,-B-.5,2*B+2,6,1,mWall);addBox(0,B+.5,2*B+2,6,1,mWall);addBox(-B-.5,0,1,6,2*B+2,mWall);addBox(B+.5,0,1,6,2*B+2,mWall);
[[-28,-28,16,9,14],[28,-26,14,7,16],[-26,26,12,6,18],[30,30,16,10,12]].forEach(a=>addBox(...a,mBuild));
let sd=7;const lc=()=>(sd=(sd*16807)%2147483647)/2147483647;
for(let i=0;i<26;i++){const s=1.5+lc()*1.5,x=(lc()-.5)*100,z=(lc()-.5)*100;if(Math.hypot(x,z)>7)addBox(x,z,s,s*(lc()<.3?1.6:.8),s,mCrate)}
for(let i=0;i<8;i++){const x=(lc()-.5)*90,z=(lc()-.5)*90;if(Math.hypot(x,z)>7)addBox(x,z,lc()<.5?6:.9,1.2,lc()<.5?.9:6,mConc)}
/* props : barils explosifs-look (collision) et lampadaires */
const bg=new R.CylinderGeometry(.4,.4,1.1,10),bmt=[new R.MeshStandardMaterial({color:0x8a2a1a,roughness:.5,metalness:.4}),new R.MeshStandardMaterial({color:0x2a4a7a,roughness:.5,metalness:.4})];
for(let i=0;i<16;i++){const x=(lc()-.5)*100,z=(lc()-.5)*100;if(Math.hypot(x,z)<7)continue;const m=new R.Mesh(bg,bmt[i%2]);m.position.set(x,.55,z);m.castShadow=m.receiveShadow=true;scene.add(m);bm.push(m);boxes.push({x0:x-.4,x1:x+.4,z0:z-.4,z1:z+.4,top:1.1,cx:x,cz:z,r:.6})}
const pg2=new R.CylinderGeometry(.08,.1,6,6),pm2=new R.MeshStandardMaterial({color:0x333333}),lg=new R.SphereGeometry(.3,8,8),lm=new R.MeshBasicMaterial({color:0xffe9b0});
for(let i=0;i<10;i++){const x=-50+(i%5)*25,z=i<5?-8:12,p=new R.Mesh(pg2,pm2),l=new R.Mesh(lg,lm);p.position.set(x,3,z);l.position.set(x,6.1,z);p.castShadow=true;scene.add(p,l)}
/* collisions cercle/AABB, retourne la hauteur du sol sous le point */
function collide(p,r){let g=0;for(const b of boxes){if(!(p.x>b.x0-r&&p.x<b.x1+r&&p.z>b.z0-r&&p.z<b.z1+r))continue;
 if(p.y>=b.top-.35){g=Math.max(g,b.top);continue}
 const dx=Math.min(p.x-(b.x0-r),b.x1+r-p.x),dz=Math.min(p.z-(b.z0-r),b.z1+r-p.z);
 if(dx<dz)p.x+=p.x<b.cx?-dx:dx;else p.z+=p.z<b.cz?-dz:dz}return g}
/* ================= PARAMÈTRES ================= */
const settings={uiScale:1,volume:1,sensitivity:1};

function applySettings(){
  document.documentElement.style.setProperty('--ui-scale',settings.uiScale);
  $('hud').style.fontSize=(settings.uiScale*100)+'%';
  $('uiScaleValue').textContent=Math.round(settings.uiScale*100)+'%';
  $('volumeValue').textContent=Math.round(settings.volume*100)+'%';
  $('sensitivityValue').textContent=Math.round(settings.sensitivity*100)+'%';
  if(masterGain) masterGain.gain.value=settings.volume;
}

function resumeGame(){
  if(state!=='pause')return;
  $('pause').style.display='none';
  state='play';
  lock();
}

function setupSettings(){
  $('uiScale').oninput=e=>{settings.uiScale=+e.target.value/100;applySettings()};
  $('volume').oninput=e=>{settings.volume=+e.target.value/100;applySettings()};
  $('sensitivity').oninput=e=>{settings.sensitivity=+e.target.value/100;applySettings()};
  $('settingsBtn').onclick=()=>{$('pause').style.display='none';$('settings').style.display='flex'};
  $('settingsBack').onclick=()=>{$('settings').style.display='none';$('pause').style.display='flex'};
  $('resumeBtn').onclick=resumeGame;
  applySettings();
}

/* ================= AUDIO (synthétisé) ================= */
let AC,NB,masterGain;
function audio(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();masterGain=AC.createGain();masterGain.gain.value=settings.volume;masterGain.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
 const d=NB.getChannelData(0);for(let i=0,l=0;i<d.length;i++){l=(l+.02*(rnd()*2-1))/1.02;d[i]=rnd()*2-1}
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;s.loop=true;f.type='lowpass';f.frequency.value=250;g.gain.value=.05;s.connect(f);f.connect(g);g.connect(masterGain);s.start();
 const o=AC.createOscillator(),og=AC.createGain();o.frequency.value=55;og.gain.value=.025;o.connect(og);og.connect(masterGain);o.start()}
 if(AC.state==='suspended')AC.resume()}
function noise(d,v,f,ty='lowpass'){if(!AC)return;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;
 s.buffer=NB;fl.type=ty;fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(0,rnd(),d)}
function tone(f,d,v,ty='square',sl){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);
 if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(masterGain);o.start();o.stop(t+d)}
const sfx={shot:i=>{if(i==4){noise(.06,.5,2000);tone(140,.05,.25,'sawtooth',60);return}noise(i>1?.3:i?.1:.14,.6,i==2?900:i?2500:1800);tone(i==3?70:i==2?60:i?180:120,i>1?.25:.1,.4,'sawtooth',30)},
 reload:()=>{noise(.04,.3,3000,'highpass');setTimeout(()=>tone(600,.06,.15),600);setTimeout(()=>noise(.05,.3,3000,'highpass'),1100)},
 step:()=>noise(.06,.12,400),imp:()=>noise(.08,.25,3000,'bandpass'),hit:()=>tone(1200,.05,.12,'sine'),

/* ================= PARTICULES (pool) ================= */
const pp=[],pg=new R.BoxGeometry(1,1,1);let pi=0;
for(let i=0;i<90;i++){const m=new R.Mesh(pg,new R.MeshBasicMaterial({color:0xffffff}));m.visible=false;m.userData={v:new R.Vector3(),l:0};scene.add(m);pp.push(m)}

/* ================= JOUEUR & ARMES ================= */
const P={pos:new R.Vector3(),vel:new R.Vector3(),yaw:0,pitch:0,ground:true,hp:100,maxHp:100,hh:1.7,last:-9,score:0,streak:0,points:0,reloadMul:1,damageMul:1,speedMul:1};
const W=[

];
const A=[{ammo:30,res:120},{ammo:15,res:75},{ammo:6,res:24},{ammo:5,res:15},{ammo:0,res:0},{ammo:1,res:0}];
let cur=0,reload=0,swap=0,nextShot=0,heat=0,kick=0,flashT=0,held=0,fired=0,adsHeld=0,adsT=0,bobT=0,lastStep=0,T=0;

const SHOP_MAX={hp:3,ammo:5,reload:3,damage:3,speed:3};
const SHOP_CFG={
 hp:{label:'PV max +25',desc:'Augmente tes PV maximums de 25.',base:250,growth:1.5},

const shopBought={hp:0,ammo:0,reload:0,damage:0,speed:0};

const air=[],gr=[],k={};
function shopPrice(id){const c=SHOP_CFG[id];return Math.round(c.base*Math.pow(c.growth,shopBought[id]));}
function resetShopStock(){Object.keys(SHOP_MAX).forEach(id=>shopStock[id]=SHOP_MAX[id]);updateShopUI()}

 adsT+=((ads?1:0)-adsT)*Math.min(1,dt*10);cam.fov=75-(cur==3?58:25)*adsT;cam.updateProjectionMatrix();
 kick=Math.max(0,kick-dt*8);heat=Math.max(0,heat-dt*.05);uav=Math.max(0,uav-dt);rage=Math.max(0,rage-dt);shake=Math.max(0,shake-dt*2);
 pivot.position.set(.22*(1-adsT)+Math.sin(bobT/2)*.012*(1-adsT),-.24+.085*adsT-Math.abs(Math.cos(bobT/2))*.01*(1-adsT),-.35+kick*.06);
 pivot.rotation.x=kick*.05+(reload>0?-.6*Math.sin(Math.PI*(1-reload/(W[cur].rl*P.reloadMul))):0)+(swap>0?swap:0);
 fl.visible=flashT>0;fll.intensity=flashT>0?3:0;flashT-=dt;swap=Math.max(0,swap-dt);
 if(reload>0){reload-=dt;if(reload<=0){const w=W[cur],a=A[cur],n=Math.min(w.mag-a.ammo,a.res);a.ammo+=n;a.res-=n}}
 if(held&&(W[cur].auto||!fired))tryShoot();
 if(T-P.last>5&&P.hp<P.maxHp)P.hp=Math.min(P.maxHp,P.hp+15*dt);
 /* ennemis, ramassages, particules, vagues */
 enemies.forEach(e=>updEnemy(e,dt));for(let i=enemies.length-1;i>=0;i--)if(enemies[i].rm)enemies.splice(i,1);
 for(let i=picks.length-1;i>=0;i--){const q=picks[i];q.m.rotation.y+=dt*2;q.l-=dt;
  if(Math.hypot(q.m.position.x-P.pos.x,q.m.position.z-P.pos.z)<1.4){if(q.t=='w'){const wi=q.w;owned[wi]=true;if(wi===4)hasMini=true;A[wi]={ammo:W[wi].mag,res:W[wi].knife?0:W[wi].mag*4};equip(wi);banner(W[wi].n+' OBTENU — touche '+([2,3,4,5,6][Math.max(0,[0,2,3,4,5].indexOf(wi))]||6),3,32)}else if(q.t=='a')refill();else P.hp=Math.min(P.maxHp,P.hp+40);sfx.hit()}
  if(q.l<=0||Math.hypot(q.m.position.x-P.pos.x,q.m.position.z-P.pos.z)<1.4){scene.remove(q.m);picks.splice(i,1)}}
 pp.forEach(m=>{if(!m.visible)return;const u=m.userData;if((u.l-=dt)<=0){m.visible=false;return}u.v.y-=12*dt;m.position.addScaledVector(u.v,dt)});
 updGren(dt);const alive=enemies.filter(e=>!e.dead).length;
 if(wt>0){wt-=dt;if(wt<=0)startWave()}
 else if(toSpawn>0){spT-=dt;if(spT<=0&&alive<Math.min(5+wave,12)){spawn(wave%5===0);toSpawn--;spT=.8}}
 else if(alive==0){wt=4;P.score+=200;P.hp=Math.min(P.maxHp,P.hp+25);refill();if(wave!=5)banner('VAGUE '+wave+' TERMINÉE',2.5,36)}
 hud(dt,5+(w=>{const mv=hs>1?2:1;return(w.spr*mv*(adsT>.5?.4:1)+heat)*700})(W[cur]));
 if(P.hp<=0&&!mp){state='over';$('shop').style.display='none';document.exitPointerLock();$('fs').textContent='Score : '+P.score+' — Vague '+wave;$('over').style.display='flex';$('hud').style.display='none'}
}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;T+=dt;if(state==='play')update(dt);renderer.render(scene,cam)}
/* ================= ÉTAT & ENTRÉES ================= */
function newGame(){enemies.forEach(e=>scene.remove(e.g));enemies.length=0;picks.forEach(q=>scene.remove(q.m));picks.length=0;
 Object.assign(P,{hp:100,maxHp:100,score:0,yaw:0,pitch:0,last:-9,hh:1.7,points:0,reloadMul:1,damageMul:1,speedMul:1});P.pos.set(0,0,0);P.vel.set(0,0,0);P.dead=0;if(mp)respawnPos();A[0]={ammo:0,res:0};A[1]={ammo:12,res:48};A[2]={ammo:0,res:0};A[3]={ammo:0,res:0};A[4]={ammo:0,res:0};A[5]={ammo:1,res:0};owned=[false,true,false,false,false,true];bossDropIndex=0;hasMini=false;gren=3;strikes=0;uav=0;rage=0;shake=0;P.streak=0;air.length=0;gr.forEach(m=>m.visible=false);resetShopProgress();
 equip(1);swap=0;wave=0;toSpawn=0;wt=mp?1e9:1.5;state='menu';held=0;adsHeld=0;
 ['menu','pause','over','shop'].forEach(i=>$(i).style.display='none');syncMp()}
const lock=()=>{audio();renderer.domElement.requestPointerLock()};
$('menu').onclick=()=>{mp=false;newGame();lock()};$('shopClose').onclick=shopClose;$('again').onclick=e=>{e.stopPropagation();newGame();lock()};setupSettings();
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement){if(state!=='over'){state='play';['menu','pause','settings','shop'].forEach(i=>$(i).style.display='none');$('hud').style.display='block'}}
 else if(state==='play'){state='pause';$('pause').style.display='flex';held=0;adsHeld=0}});
addEventListener('mousemove',e=>{if(state==='play'){const ss=.0022*settings.sensitivity*(1-(cur==3?.8:.4)*adsT);P.yaw-=e.movementX*ss;P.pitch-=e.movementY*ss}});
addEventListener('mousedown',e=>{if(state!=='play')return;if(e.button==0)held=1;if(e.button==2)adsHeld=1});
addEventListener('mouseup',e=>{if(e.button==0){held=0;fired=0}if(e.button==2)adsHeld=0});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{k[e.code]=1;
 if(e.code==='Escape'){e.preventDefault();if(state==='play'){state='pause';held=0;adsHeld=0;document.exitPointerLock();$('pause').style.display='flex'}else if(state==='pause'){resumeGame()}else if(state==='shop'){shopClose()}return}
 if(state==='play'&&e.code==='KeyB'){e.preventDefault();shopOpen();return}
 if(state!=='play')return;
 if(e.code=='KeyR')startReload();
 if(e.code==='Digit6'&&owned[5]&&5!==cur)equip(5);
  if(e.code.startsWith('Digit')){const key=+e.code.slice(5);const map=[1,0,2,3,4];const n=map[key-1];if(n!=null&&owned[n]&&n!=cur)equip(n)}
 if(e.code=='KeyG')throwG();if(e.code=='KeyF')callStrike();
 if(['Space','ControlLeft'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>k[e.code]=0);
/* ================= MULTIJOUEUR EN LIGNE (capability "room" de la page publiée) =================
   Chaque joueur est autoritaire sur sa position (presence) ; le tireur envoie 'hit', la victime applique les dégâts
   et annonce 'kill'. Deathmatch : pas d'ennemis IA, respawn après 3 s. */
let pubRoom=null,room=null,mp=false,myId=null,lastK=null;const remote=new Map(),myName='Joueur'+(100+Math.floor(rnd()*900));
function mkRemote(name){const g=new R.Group(),parts=[];
 const add=(ge,m,x,y,z,hd)=>{const me=new R.Mesh(ge,m);me.position.set(x,y,z);me.castShadow=true;me.userData={pl:null,head:hd};g.add(me);parts.push(me)};
 add(eg.l,em.d,0,.4,0);add(eg.t,em.p,0,1.1,0);add(eg.h,em.s,0,1.55,0,1);add(eg.c,em.p,0,1.68,0,1);add(eg.g,em.d,.3,1.15,-.3);
 const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='bold 34px Arial';x.textAlign='center';x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=5;x.strokeText(name,128,44);x.fillText(name,128,44);
 const sp=new R.Sprite(new R.SpriteMaterial({map:new R.CanvasTexture(c),depthTest:false}));sp.scale.set(2,.5,1);sp.position.y=2.2;g.add(sp);scene.add(g);return{g,parts,name,sc:0}}
const nameOf=id=>id===myId?myName:(remote.get(id)||{}).name||'Joueur';
function board(){const a=[[myName,P.score]];remote.forEach(r=>a.push([r.name,r.sc]));return a.sort((x,y)=>y[1]-x[1]).slice(0,4).map(x=>x[0]+' '+x[1]).join(' | ')}
function respawnPos(){for(let i=0;i<30;i++){P.pos.set((rnd()-.5)*100,0,(rnd()-.5)*100);if(boxes.every(b=>!(P.pos.x>b.x0-.8&&P.pos.x<b.x1+.8&&P.pos.z>b.z0-.8&&P.pos.z<b.z1+.8)))break}P.vel.set(0,0,0)}
function syncMp(){try{if(room)room.presence({m:mp?1:0});if(!mp)remote.forEach(r=>r.g.visible=false)}catch(e){console.error(e)}}
function mpTick(dt){const seen=new Set();
 room.peers().forEach(p=>{if(p.isMe){if(p.sameTab)myId=p.peer;return}const q=p.presence;if(q.m!==1||typeof q.x!=='number')return;seen.add(p.peer);
  let r=remote.get(p.peer);if(!r){r=mkRemote(String(q.n||'Joueur').slice(0,16));r.parts.forEach(m=>m.userData.pl=p.peer);remote.set(p.peer,r)}
  const g=r.g.position,k2=Math.min(1,dt*12);r.sc=q.s|0;r.g.visible=q.a===1;g.x+=(q.x-g.x)*k2;g.y+=(q.y-g.y)*k2;g.z+=(q.z-g.z)*k2;r.g.rotation.y=+q.yaw||0;r.g.scale.y=q.c?.75:1});
 remote.forEach((r,id)=>{if(!seen.has(id)){scene.remove(r.g);r.g.children.forEach(c=>c.material&&c.material.map&&c.material.map.dispose());remote.delete(id)}});
 room.presence({m:1,x:+P.pos.x.toFixed(2),y:+P.pos.y.toFixed(2),z:+P.pos.z.toFixed(2),yaw:+P.yaw.toFixed(2),n:myName,s:P.score,a:P.dead?0:1,c:P.hh<1.4?1:0});
 if(P.hp<=0&&!P.dead){P.dead=T;room.emit('kill',{k:lastK,v:myId});banner('ÉLIMINÉ',3,40);held=0}
 if(P.dead&&T-P.dead>3){P.dead=0;P.hp=P.maxHp;P.last=T;respawnPos();if(owned[0])A[0].ammo=W[0].mag;if(owned[1])A[1].ammo=W[1].mag;if(owned[2])A[2].ammo=W[2].mag;if(owned[3])A[3].ammo=W[3].mag;if(owned[4])A[4].ammo=W[4].mag;refill();banner('EN JEU',1,30)}}
async function initMp(){if(!window.claude)return;try{room=pubRoom=await claude.use('room')}catch(e){}if(!room)return;
 $('mpbtn').style.display='inline-block';$('mpbtn').onclick=e=>{e.stopPropagation();room=pubRoom;mp=false;newGame();lock()};
 room.on('hit',m=>{const d=m.data;if(!mp||!d||d.t!==myId||P.dead||P.hp<=0||state!=='play'||typeof d.d!=='number')return;lastK=m.peer;const r=remote.get(m.peer);hurt(Math.min(Math.max(d.d,0),250),r?r.g.position:P.pos)});
 room.on('kill',m=>{const d=m.data;if(!mp||!d)return;banner(nameOf(d.k)+' ➜ '+nameOf(d.v),2,24);if(d.k===myId&&d.v!==myId)P.score+=100});
 room.on('shot',m=>{if(!mp||m.isMe)return;const r=remote.get(m.peer);if(!r)return;const g=r.g.position;sfx.eshot(Math.hypot(g.x-P.pos.x,g.z-P.pos.z));spark(v1.set(g.x,1.3,g.z),0xffcc55,2,1,.12)});
 setInterval(()=>{$('mpn').textContent=pubRoom.peers().filter(p=>!p.isMe&&p.presence.m===1).length+' autre(s) joueur(s) en ligne'},1000)}
initMp();
requestAnimationFrame(loop);
